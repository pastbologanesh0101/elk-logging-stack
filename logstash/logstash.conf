# Logstash pipeline for the ELK Logging Stack sample app.
#
# Input:  reads the Flask app's log file directly (app/logs/app.log) via the
#         `file` input. This keeps the demo self-contained (no extra shipper
#         process required) — Filebeat could be swapped in for a production
#         setup, in which case this would become a `beats` input on port 5044.
#
# Filter: a grok filter parses the app's log line format:
#
#   2026-09-18 12:00:01,123 INFO service=app method=GET path=/orders status=200 duration_ms=12
#
#         into structured fields: timestamp, level, service, method, path,
#         status, duration_ms.
#
# Output: structured events are shipped to Elasticsearch, one index per day.

input {
  file {
    path => "/usr/share/logstash/app-logs/app.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "plain"
  }
}

filter {
  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} service=%{WORD:service} method=%{WORD:method} path=%{NOTSPACE:path} status=%{NONNEGINT:status} duration_ms=%{NONNEGINT:duration_ms}"
    }
  }

  date {
    match => ["timestamp", "yyyy-MM-dd HH:mm:ss,SSS"]
    target => "@timestamp"
  }

  mutate {
    convert => {
      "status" => "integer"
      "duration_ms" => "integer"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "elk-logging-stack-%{+YYYY.MM.dd}"
  }

  # Uncomment while developing the pipeline to see parsed events on stdout:
  # stdout { codec => rubydebug }
}
